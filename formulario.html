<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body style="background-color: #f0f0f0; font-family: Arial, sans-serif; text-align: center;">

    <h1>Formulário de Contato</h1>

    <form>
        <!-- LEGENDA PARA NOME -->
        <label for="nome">Nome:</label>

        <!-- CAMPO DO TYPE NOME -->
        <input type="text" id="nome" name="nome" required><br><br>

        <!-- LEGENDA PARA APELIDO -->
        <label for="apelido">Apelido:</label>

        <!-- CAMPO DO TYPE APELIDO -->
        <input type="text" id="apelido" name="apelido" required><br><br>

        <!-- LEGENDA PARA EMAIL -->
        <label for="email">Email:</label>

        <!-- CAMPO DO TYPE EMAIL -->
        <input type="email" id="email" name="email" required><br><br>

        <!-- LEGENDA PARA TELEFONE -->
        <label for="telefone">Telefone:</label>

        <!-- CAMPO DO TYPE TELEFONE -->
        <input type="tel" id="telefone" name="telefone"><br><br>

        <!-- LEGENDA PARA SENHA -->
        <label for="password">Senha:</label>

        <!-- CAMPO DO TYPE PASSWORD -->
        <input type="password" id="password" name="password" required><br><br>

        <!-- LEGENDA PARA MENSAGEM -->
        <label for="mensagem">Mensagem:</label><br>

        <!-- CAMPO DO TYPE MENSAGEM -->
        <textarea id="mensagem" name="mensagem" rows="4" cols="50" required></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>
<br><br>
<hr>
    <a href="index.html">Voltar à página inicial</a>
</body>
</html>
